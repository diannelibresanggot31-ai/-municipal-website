{% extends "base.html" %}

{% block content %}
<section style="padding: 60px 0;">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h1 style="color: #1a3c5e; margin-bottom: 20px;">Contact Us</h1>
                <p>Have questions? Send us a message and we'll respond within 24 hours.</p>
                
                <div style="margin: 40px 0;">
                    <div style="margin-bottom: 20px;">
                        <i class="fas fa-phone" style="font-size: 24px; color: #f0a500;"></i>
                        <h5 style="display: inline-block; margin-left: 15px;">Phone</h5>
                        <p style="margin-left: 45px;">(555) 123-4567</p>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <i class="fas fa-envelope" style="font-size: 24px; color: #f0a500;"></i>
                        <h5 style="display: inline-block; margin-left: 15px;">Email</h5>
                        <p style="margin-left: 45px;">info@municipality.gov</p>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <i class="fas fa-map-marker-alt" style="font-size: 24px; color: #f0a500;"></i>
                        <h5 style="display: inline-block; margin-left: 15px;">Address</h5>
                        <p style="margin-left: 45px;">123 Municipal Hall, City Center, 1000</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="announcement-card">
                    <h3 style="color: #1a3c5e; margin-bottom: 20px;">Send a Message</h3>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message *</label>
                            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn-custom">Send Message →</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
