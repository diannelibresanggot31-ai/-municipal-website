{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Emergency Services</h1>
    <p class="text-center mb-5">24/7 Emergency response services for the Municipality of Las Nieves</p>

    <!-- ONLY Emergency Hotlines - NO individual cards -->
    <div class="card shadow-lg mb-5">
        <div class="card-header bg-danger text-white text-center">
            <h3><i class="fas fa-phone-alt"></i> Emergency Hotlines</h3>
        </div>
        <div class="card-body">
            <div class="row text-center">
                <div class="col-md-3 mb-3">
                    <div class="emergency-card">
                        <i class="fas fa-shield-alt fa-3x text-danger"></i>
                        <h5 class="mt-2">Police</h5>
                        <p class="h4">117</p>
                        <p>(088) 813-0114</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="emergency-card">
                        <i class="fas fa-fire-extinguisher fa-3x text-warning"></i>
                        <h5 class="mt-2">Fire</h5>
                        <p class="h4">160</p>
                        <p>(088) 813-0116</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="emergency-card">
                        <i class="fas fa-ambulance fa-3x text-info"></i>
                        <h5 class="mt-2">EMS/Ambulance</h5>
                        <p class="h4">911</p>
                        <p>(088) 813-0118</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="emergency-card">
                        <i class="fas fa-hospital-user fa-3x text-success"></i>
                        <h5 class="mt-2">RHU</h5>
                        <p>(085) 123-4567</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
    </div>
</div>

<style>
.emergency-card {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    transition: transform 0.2s;
}
.emergency-card:hover {
    transform: translateY(-5px);
    background: #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
</style>
{% endblock %}
