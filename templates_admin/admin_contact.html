{% extends "admin_base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-white">
            <h4 class="mb-0"><i class="fas fa-address-book"></i> Contact Information Management</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Municipal Address</label>
                            <input type="text" name="address" class="form-control" value="{{ settings.address }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ settings.phone }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" value="{{ settings.email }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Facebook Page URL</label>
                            <input type="text" name="facebook" class="form-control" value="{{ settings.facebook }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Twitter URL</label>
                            <input type="text" name="twitter" class="form-control" value="{{ settings.twitter }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Operating Hours</label>
                            <input type="text" name="hours" class="form-control" value="{{ settings.hours }}">
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Contact Information
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
