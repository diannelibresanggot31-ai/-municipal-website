{% extends "admin_base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-white">
            <h4 class="mb-0">
                <i class="fas fa-{% if announcement %}edit{% else %}plus{% endif %}"></i> 
                {% if announcement %}Edit Announcement{% else %}Create New Announcement{% endif %}
            </h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-control" value="{{ announcement.title if announcement else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Content *</label>
                    <textarea name="content" rows="8" class="form-control" required>{{ announcement.content if announcement else '' }}</textarea>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> {% if announcement %}Update{% else %}Save{% endif %} Announcement
                    </button>
                    <a href="/admin/announcements" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
