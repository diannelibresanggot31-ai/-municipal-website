<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Las Nieves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Source Sans 3', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d2b16;
            overflow: hidden;
            position: relative;
        }

        /* animated background circles */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
        }
        .bg-orb-1 { width: 500px; height: 500px; background: #2a7a3b; top: -120px; left: -100px; animation: drift1 12s ease-in-out infinite; }
        .bg-orb-2 { width: 380px; height: 380px; background: #1a5228; bottom: -80px; right: -80px; animation: drift2 15s ease-in-out infinite; }
        .bg-orb-3 { width: 260px; height: 260px; background: #3d9950; top: 40%; left: 60%; animation: drift3 10s ease-in-out infinite; }

        @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,-40px)} }
        @keyframes drift3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,20px)} }

        /* subtle grid pattern */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .login-wrapper {
            position: relative; z-index: 10;
            width: 100%; max-width: 420px;
            padding: 16px;
            animation: fadeUp 0.6s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(255,255,255,0.97);
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #0d2b16 0%, #1a5228 60%, #2a7a3b 100%);
            padding: 36px 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-header::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 70% 30%, rgba(61,153,80,0.3) 0%, transparent 60%);
        }
        .login-seal {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            position: relative; z-index: 1;
        }
        .login-seal i { font-size: 22px; color: rgba(255,255,255,0.9); }
        .login-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px; font-weight: 700;
            color: #fff; margin-bottom: 4px;
            position: relative; z-index: 1;
        }
        .login-header p {
            font-size: 12.5px; color: rgba(255,255,255,0.55);
            position: relative; z-index: 1;
            letter-spacing: 0.06em; text-transform: uppercase;
        }

        .login-body { padding: 36px 40px 40px; }

        .form-label {
            font-size: 12px; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: #444; margin-bottom: 6px; display: block;
        }
        .input-wrap {
            position: relative; margin-bottom: 20px;
        }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #999; font-size: 13px;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px 11px 38px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Source Sans 3', sans-serif;
            color: #222;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        .form-control:focus {
            border-color: #2a7a3b;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(42,122,59,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a5228, #2a7a3b);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px; font-weight: 600;
            font-family: 'Source Sans 3', sans-serif;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 6px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #0d2b16, #1a5228);
            box-shadow: 0 4px 16px rgba(26,82,40,0.35);
            transform: translateY(-1px);
        }
        .btn-login:active { transform: translateY(0); }

        .error-msg {
            background: #fff0f0;
            border: 1px solid #ffc0c0;
            border-left: 3px solid #c62828;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            color: #c62828;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link {
            text-align: center; margin-top: 20px;
        }
        .back-link a {
            font-size: 12.5px; color: #888; text-decoration: none;
            display: inline-flex; align-items: center; gap: 5px;
            transition: color 0.15s;
        }
        .back-link a:hover { color: #2a7a3b; }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-seal"><i class="fas fa-leaf"></i></div>
                <h2>Admin Portal</h2>
                <p>Municipality of Las Nieves</p>
            </div>
            <div class="login-body">
                {% if error %}
                <div class="error-msg">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    <label class="form-label">Username</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
                    </div>

                    <label class="form-label">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                    </button>
                </form>

                <div class="back-link">
                    <a href="/"><i class="fas fa-arrow-left"></i> Back to main site</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
